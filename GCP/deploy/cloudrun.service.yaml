apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: movilidad-social-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      serviceAccountName: movilidad-social-api
      containerConcurrency: 40
      timeoutSeconds: 60
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/movilidad-social-api:TAG
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: MSMX_API_ENVIRONMENT
              value: prod
            - name: MSMX_API_MODEL_PATH
              value: models/modelo_entrenado.joblib
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
