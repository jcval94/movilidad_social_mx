apiVersion: apps/v1
kind: Deployment
metadata:
  name: movilidad-social-app
  namespace: movilidad-social
  labels:
    app: movilidad-social
spec:
  replicas: 3
  selector:
    matchLabels:
      app: movilidad-social
  template:
    metadata:
      labels:
        app: movilidad-social
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: ghcr.io/your-org/movilidad-social-mx:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
              name: http
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          env:
            - name: K8S_CPU_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: app
                  resource: limits.cpu
            - name: DIAG_NODE_TYPE
              value: "general"
            - name: DIAG_WORKERS_GENERAL
              value: "1"
            - name: MAX_QUEUED_JOBS
              value: "32"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: movilidad-social-secrets
                  key: gemini_api_key
