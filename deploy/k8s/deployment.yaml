apiVersion: apps/v1
kind: Deployment
metadata:
  name: movilidad-social-app
  namespace: movilidad-social
  labels:
    app: movilidad-social
spec:
  replicas: 3
  selector:
    matchLabels:
      app: movilidad-social
  template:
    metadata:
      labels:
        app: movilidad-social
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: ghcr.io/your-org/movilidad-social-mx:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
              name: http
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "from state_backend import assert_redis_ready; assert_redis_ready()"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - python
                - -c
                - "from state_backend import assert_redis_ready; assert_redis_ready()"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: movilidad-social-secrets
                  key: gemini_api_key
            - name: REDIS_URL
              value: redis://redis-master.movilidad-social.svc.cluster.local:6379/0
            - name: REDIS_REQUIRED
              value: "true"
            - name: ENV
              value: production
            - name: RESOURCES_LIMITS_CPU
              valueFrom:
                resourceFieldRef:
                  containerName: app
                  resource: limits.cpu
                  divisor: "1"
            - name: MAX_QUEUED_JOBS
              value: "64"
            - name: DIAG_WORKERS_SMALL
              value: "1"
            - name: DIAG_WORKERS_MEDIUM
              value: "2"
            - name: DIAG_WORKERS_LARGE
              value: "4"
