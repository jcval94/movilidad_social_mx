name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff mypy pyyaml

      - name: Lint
        run: |
          ruff check src tests scripts

      - name: Type checking
        run: |
          mypy --ignore-missing-imports --explicit-package-bases src/backtest src/execution src/notifications src/reporting src/storage scripts/validate_repo.py

      - name: Unit + integration tests with coverage
        run: |
          pytest -q --cov=src --cov-report=term-missing --cov-fail-under=65

      - name: Smoke end-to-end tests
        run: |
          python scripts/validate_repo.py --smoke

      - name: Security, schema and permission validation
        run: |
          python scripts/validate_repo.py --strict
